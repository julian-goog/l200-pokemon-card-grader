[project]
name = "pokegrade-ai"
version = "1.0.0"
description = "PokéGrade AI — Enterprise Multi-Agent Collectible Pokémon Card Grading & Marketplace Concierge on GCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "google-adk>=1.0.0",
    "google-cloud-secret-manager>=2.20.0",
    "streamlit>=1.36.0",
    "pillow>=10.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
